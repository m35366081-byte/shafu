<!DOCTYPE html>
<html>
    <head>
        <title>SMB Register Form</title>
        <link rel="icon" href="image/stidio 1.jpg">
    </head>
    <body>
        <center>
            <h1 style="font-family: Georgia, 'Times New Roman', Times, serif;">Register Form</h1>
            <form action="smb.html" method="get">
                <table>
                    <tr>
                        <td>Customer Name:</td> <td><input type="text" placeholder="Enter Your Name"</td>
                    </tr>
                    <tr>
                        <td>Mobile Number:</td><td><input type="tel" placeholder="Enter Your Number"</td>
                    </tr>
                    <tr>
                        <td>Email:</td> <td><input type="email" placeholder="Enter Your Email"</td>
                    </tr>
                    <tr>
                        <td>Select Service: <select>
                            <option>Photography</option>
                            <option>Logo Design</option>
                            <option>Web Design</option>
                            <option>Video Editing </option>
                        </select>
                    </td>
                    </tr>
                    <tr>
                        <td>Message:</td>
                        <td> <textarea rows="6"cols="40"  placeholder="Tell us about Your Requirements......"></textarea>
                        </td></tr>
                       
                      
                        <tr>
                        <td colspan="2" align="Customer"><button type="submit"> SUBMIT</button></td>
                    </tr>
                     </table>
                </form>
                    
                    

                



        </center>

    </body>
</html>
